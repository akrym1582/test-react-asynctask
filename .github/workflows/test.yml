name: AfterTasks checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: ["18", "19"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - if: matrix.react == '18'
        run: npm install --no-save react@18.3.1 react-dom@18.3.1 @types/react@18 @types/react-dom@18
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:copy
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      # 失敗時はActionsのArtifactsからレポート・トレース・画面を確認できます。
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aftertasks-browser-benchmark
          path: test-results/
          retention-days: 7
