name: AfterTasks performance
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aftertasks-jsdom-benchmark
          path: benchmark-results/
